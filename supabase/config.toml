project_id = "dinkframe"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://app.dinkframe.my"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://app.dinkframe.my/auth/callback",
  "https://dinkframe.my/auth/callback",
  "https://dinkframe.vercel.app/auth/callback",
  "https://*-randomzzguys-projects.vercel.app/**",
]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.email.template.invite]
subject = "You’re invited to DINKFRAME"
content_path = "./supabase/templates/invite-user.html"

[auth.email.template.confirmation]
subject = "Confirm your email for DINKFRAME"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.recovery]
subject = "Reset your DINKFRAME password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.magic_link]
subject = "Your secure DINKFRAME sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirm your new DINKFRAME email"
content_path = "./supabase/templates/change-email.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"
